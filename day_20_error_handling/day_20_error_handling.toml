# File: pyproject.toml
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defensive-error-handling-lab"
version = "1.0.0"
description = "Production-oriented educational project for exceptions, validation, and defensive programming."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0"
]

[project.scripts]
error-handling-demo = "src.python_app.cli:main"

[tool.setuptools]
packages = ["src", "src.python_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
